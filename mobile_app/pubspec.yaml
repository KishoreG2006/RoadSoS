name: roadsos_mobile
description: "RoadSOS Mobile Application - Emergency Assistance & Safety Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1
  http: ^1.1.2
  connectivity_plus: ^6.0.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  flutter_contacts: ^1.1.7
  sensors_plus: ^7.1.0
  geolocator: ^10.1.0
  tflite_flutter: ^0.12.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.5



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
